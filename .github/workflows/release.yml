name: Release

# Publishing is driven by a tag. The version in package.json is the source of
# truth; the tag must match it exactly. Nothing here bumps the version -- that
# happens in a normal PR, so the version change is reviewed like any other.
#
#   npm version minor --no-git-tag-version   # or patch
#   # commit, open a PR, merge to main
#   git tag v0.13.0 origin/main && git push origin v0.13.0
#
# See RELEASING.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and attach the VSIX, but do not publish to the Marketplace'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # @vscode/vsce requires node >= 20
          cache: 'npm'

      # The tag is the only thing a human types, and package.json is what the
      # Marketplace shows. If they disagree, a published 0.13.0 can be tagged
      # v0.14.0 and the tag stops being a reliable pointer at shipped code.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag_version, but package.json says $pkg_version."
            echo "Bump package.json and re-tag, or delete the tag. Nothing was published."
            exit 1
          fi
          echo "version $pkg_version"

      # publish.sh guarded this by REWRITING the source at publish time. Failing
      # is better than rewriting: a non-production host in a release build means
      # someone committed a debugging change, and that should be fixed in a
      # commit, not silently patched over during the release.
      - name: No non-production API host in the source
        run: |
          if grep -nE 'https://(stage|dev|staging|local)\.instawp\.(io|test)' extension.js; then
            echo "::error::extension.js points at a non-production InstaWP host (lines above). Nothing was published."
            exit 1
          fi
          grep -q 'https://app.instawp.io' extension.js || {
            echo "::error::extension.js does not reference https://app.instawp.io at all. Nothing was published."
            exit 1
          }

      - run: npm ci

      - run: npx --yes @vscode/vsce@^3 package --out "instacode-${{ github.ref_name }}.vsix"

      # Everything above runs on a dry run too, so a manual dispatch exercises
      # the whole pipeline and hands back an installable VSIX without touching
      # the Marketplace.
      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/') || inputs.dry_run == false
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx --yes @vscode/vsce@^3 publish --packagePath instacode-*.vsix

      - name: Attach the VSIX to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" instacode-*.vsix \
            --title "${GITHUB_REF_NAME}" \
            --notes "Published to the VS Code Marketplace: https://marketplace.visualstudio.com/items?itemName=InstaWP.instacode"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
